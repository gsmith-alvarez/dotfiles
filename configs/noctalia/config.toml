[theme]
mode = "dark"
source = "builtin"
builtin = "Catppuccin"

[shell]
corner_radius_scale = 1.0
avatar_path = "~/.face"
telemetry_enabled = true
password_style = "random"

[shell.animation]
enabled = true
speed = 1.5

[shell.shadow]
direction = "down_right"
alpha = 0.55

[shell.panel]
transparency_mode = "glass"

[shell.launcher]
categories = true
sort_by_usage = true

[lockscreen]
blurred_desktop       = true
blur_intensity        = 0.5
tint_intensity        = 0.3

[shell.time_format]
format = "%H:%M"

[location]
address = "Toronto, ON"

[weather]
enabled = true
effects = true

[nightlight]
enabled = false
temperature_day = 6500
temperature_night = 4000

[audio]
enable_overdrive = false
enable_sounds = false

[notification]
position = "top_right"
background_opacity = 0.9

[osd]
position = "top_right"
background_opacity = 1.0

[idle.behavior.lock]
timeout = 660
action = "lock"
enabled = true

[idle.behavior.screen-off]
timeout = 600
action = "screen_off"
enabled = true

[idle.behavior.suspend]
timeout = 1800
action = "lock_and_suspend"
enabled = true

[dock]
enabled = true
position = "bottom"
auto_hide = true
active_monitor_only = true
background_opacity = 1.0
show_dots = true
show_instance_count = false

[wallpaper]
enabled = true
directory = "~/Pictures/Wallpapers"
fill_mode = "crop"
fill_color = "#000000"
transition = ["fade", "disc", "stripes", "wipe", "pixelate", "honeycomb"]
transition_duration = 1500
edge_smoothness = 0.05

[wallpaper.automation]
enabled = false
interval_seconds = 300
order = "random"

[system.monitor]
enabled = true

[control_center]
sidebar = "compact"

[[control_center.shortcuts]]
type = "wifi"

[[control_center.shortcuts]]
type = "bluetooth"

[[control_center.shortcuts]]
type = "caffeine"

[[control_center.shortcuts]]
type = "notification"

[[control_center.shortcuts]]
type = "power_profile"

[[control_center.shortcuts]]
type = "nightlight"

[shell.greeter_sync]
auto_sync = true
